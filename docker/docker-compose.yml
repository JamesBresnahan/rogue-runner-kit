services:
  claude-agent:
    build: .
    # Host networking is required so this container can reach the Claude
    # Code Chrome extension relay running on the host (needed by
    # star-strava-routes). This trades away network-namespace isolation —
    # filesystem and credential isolation below are unaffected: the
    # container still only ever sees its own two secrets directories and
    # this one repo directory, nothing else on the host filesystem.
    network_mode: host
    environment:
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    volumes:
      - ${HOME}/agent-secrets/static:/run/secrets/static:rw
      - ${HOME}/agent-secrets/tokens:/run/secrets/tokens:rw
      - rogue-runner-agent-home:/home/agent
      # Bind-mounts the user's own clone directly (this file always lives at
      # <repo-root>/docker/docker-compose.yml, so ".." always resolves to
      # the repo root regardless of where on their machine they cloned it —
      # no path needs to be asked for or configured). This is deliberately
      # a real bind mount, not a container-managed volume: it's what lets a
      # non-technical user just drag a file (e.g. their pace-chart xlsx)
      # into specs/resources/ in a normal Finder/Explorer window and have
      # it show up inside the container immediately, no git or docker
      # commands required.
      - ..:/workspace/rogue-runner-kit:rw
    working_dir: /workspace/rogue-runner-kit
    stdin_open: true
    tty: true

volumes:
  rogue-runner-agent-home:
